<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · Seguridad Escolar</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header><h1>Seguridad Escolar</h1><a href="index.html" style="color:#fff">Iniciar sesión</a></header>
  <main>
    <h2>Crear cuenta</h2>
    <form id="form-registro">
      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="nombre" required>
      <label for="matricula">Matrícula</label>
      <input id="matricula" name="matricula" required>
      <label for="grupoEscolar">Grupo (por ejemplo 3A)</label>
      <input id="grupoEscolar" name="grupoEscolar" required>
      <label for="password">Contraseña (mínimo 8 caracteres)</label>
      <input id="password" name="password" type="password" required minlength="8">
      <label for="confirmar">Confirma tu contraseña</label>
      <input id="confirmar" name="confirmar" type="password" required minlength="8">
      <label for="codigo">Código de registro del plantel</label>
      <input id="codigo" name="codigo" required>
      <button type="submit">Crear cuenta</button>
      <p id="mensaje" class="mensaje error oculto"></p>
    </form>
    <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
  </main>
  <script type="module">
    import { api } from './js/api.js';
    import { guardarSesion } from './js/sesion.js';

    const form = document.querySelector('#form-registro');
    const mensaje = document.querySelector('#mensaje');

    function mostrarError(texto) {
      mensaje.textContent = texto;
      mensaje.classList.remove('oculto');
    }

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const { confirmar, ...datos } = Object.fromEntries(new FormData(form));

      // Validación en el cliente: ayuda al usuario, pero la REAL está en el servidor (RN-03)
      if (datos.password.length < 8) return mostrarError('La contraseña debe tener al menos 8 caracteres');
      if (datos.password !== confirmar) return mostrarError('Las contraseñas no coinciden');

      try {
        await api('/auth/registro', { metodo: 'POST', datos });
        // Cuenta creada: iniciamos sesión de una vez para no pedir los datos otra vez
        const sesion = await api('/auth/login', {
          metodo: 'POST',
          datos: { matricula: datos.matricula, password: datos.password }
        });
        guardarSesion(sesion);
        location.href = 'inicio.html';
      } catch (error) {
        mostrarError(error.message);
      }
    });
  </script>
</body>
</html>
